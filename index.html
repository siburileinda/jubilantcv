<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My GitHub Page</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 20px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    p {
      color: #9da7b1;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background: #238636;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    a:hover {
      background: #2ea043;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🚀 Welcome</h1>
    <p>
      Ini adalah halaman GitHub Pages sederhana. Kamu bisa pakai ini untuk
      landing page, portfolio, atau project awal.
    </p>

    <a href="https://github.com/">Go to GitHub</a>
  </div>
</body>
</html>
